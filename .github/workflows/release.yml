name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact: macos-universal
            rust_target: universal-apple-darwin
            args: "--target universal-apple-darwin --bundles app,dmg"
          - platform: ubuntu-22.04
            artifact: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu --bundles appimage"
          - platform: ubuntu-24.04-arm
            artifact: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu --bundles appimage"
          - platform: windows-latest
            artifact: windows-x64
            rust_target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
          - platform: windows-11-arm
            artifact: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri app and draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SkillDeck ${{ github.ref_name }}"
          releaseBody: |
            SkillDeck is the desktop GUI for the open agent skills tool — npx skills.

            Use SkillDeck to search, install, inspect, update, remove, and troubleshoot AI agent skills for Claude, Codex, Cursor, and other supported agents from a cross-platform desktop interface.

            Release bundles are built by GitHub Actions. Because the project has not yet integrated platform code signing and notarization, operating systems may show warnings such as "unverified developer" or "unknown publisher". This means the OS cannot verify the publisher identity; only download builds from this repository's GitHub Releases, and continue only after confirming the source is trusted.

            When the operating system shows a security warning:

            - macOS: after the first launch is blocked, open System Settings > Privacy & Security, then choose to open the app from the security notice.
            - Windows: if SmartScreen shows an unknown publisher warning, confirm the file came from this repository's Releases, then choose More info and continue running it.
            - Linux: prefer the package format supported by your distribution; if the desktop environment blocks launch, allow the file to run as a program in file properties, or install it through the system software installer.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skilldeck-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn

  latest-manifest:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create updater manifest
        env:
          RELEASE_NOTES: SkillDeck desktop update.
        run: node .github/scripts/create-latest-manifest.mjs release-artifacts latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
